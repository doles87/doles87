name = "povratek"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "povratek"
# Po `npx wrangler d1 create povratek` sem prilepi database_id, ki ga izpiše ukaz.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ADMIN_EMAILS (e-naslovi, ki ob registraciji dobijo vlogo admin, ločeni z vejico)
# nastavi kot skrivnost: `npx wrangler secret put ADMIN_EMAILS`, lokalno pa v datoteki .dev.vars.
