name = "povratek"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "povratek"
# Po `npx wrangler d1 create povratek` sem prilepi database_id, ki ga izpiše ukaz.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ADMIN_EMAILS (e-naslovi, ki ob registraciji dobijo vlogo admin, ločeni z vejico)
# nastavi kot skrivnost: `npx wrangler secret put ADMIN_EMAILS`, lokalno pa v datoteki .dev.vars.

[vars]
# Pravila odpovedi (zneski v evrih, časi v minutah/urah).
CANCEL_FEE_EUR = "4"
FREE_CANCEL_GRACE_MIN = "10"
FREE_CANCEL_HOURS = "2"
LATE_THRESHOLD_MIN = "15"
NO_SHOW_WAIT_MIN = "5"

# Google Maps (neobvezno; brez ključev aplikacija uporablja oceno brez prometa in povezavo na Google Maps):
#   npx wrangler secret put GOOGLE_MAPS_API_KEY    -> Routes API, prihod s prometom v živo (strežniški ključ)
#   npx wrangler secret put GOOGLE_MAPS_EMBED_KEY  -> Maps Embed API, zemljevid za potnika (ključ omejen na domeno)
